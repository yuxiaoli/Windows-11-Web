  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/icons/favicon.svg" />

    <meta name="title" content="Sean's Windows 11 Web" />
    <meta name="description" content="Sean's personal web desktop. Explore Vector Index and this Windows 11 Web fork, originally created by Piyush Suthar." />
    <link rel="canonical" href="__SITE_URL__" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:title" content="Sean's Windows 11 Web" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      if (import.meta.env.PROD && "serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          let wasControlled = Boolean(navigator.serviceWorker.controller);
          let refreshed = false;
          navigator.serviceWorker.addEventListener("controllerchange", function () {
            const replacingController = wasControlled;
            wasControlled = Boolean(navigator.serviceWorker.controller);
            if (replacingController && !refreshed) {
              refreshed = true;
              window.location.reload();
            }
          });
          navigator.serviceWorker.register(import.meta.env.BASE_URL + "sw.js", { scope: import.meta.env.BASE_URL, updateViaCache: "none" })
            .then(function (registration) { return registration.update(); })
            .catch(function (error) { console.warn("Offline cache unavailable", error); });
        });
      }
    </script>
  </body>
</html>
